<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="../calculator/calculator.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="container">

    <div class="display">
        <input type="text" id="screen" readonly>
    </div>

    <div class="top-icons">
        <button class="icon-btn">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </button>

        <button class="icon-btn" id="scientificBtn">
            <i class="fa-solid fa-calculator"></i>
        </button>

        <button class="icon-btn" id="currencyIcon">
            <i class="fa-solid fa-money-bill-transfer"></i>
        </button>
    </div>

   
    <div class="calculator-body">

        <div class="scientific-panel">

            <div class="row">
                <button class="btn scientific">2nd</button>
                <button class="btn scientific">(</button>
                <button class="btn scientific">)</button>
                <button class="btn scientific">10ˣ</button>
            </div>

            <div class="row">
                <button class="btn scientific">1/x</button>
                <button class="btn scientific">x²</button>
                <button class="btn scientific">x³</button>
                <button class="btn scientific">xʸ</button>
            </div>

            <div class="row">
                <button class="btn scientific">x!</button>
                <button class="btn scientific">√</button>
                <button class="btn scientific">ʸ√x</button>
                <button class="btn scientific">lg</button>
            </div>

            <div class="row">
                <button class="btn scientific">sin</button>
                <button class="btn scientific">cos</button>
                <button class="btn scientific">tan</button>
                <button class="btn scientific">ln</button>
            </div>

            <div class="row">
                <button class="btn scientific">sinh</button>
                <button class="btn scientific">cosh</button>
                <button class="btn scientific">tanh</button>
                <button class="btn scientific">eˣ</button>
            </div>

            <div class="row">
                <button class="btn scientific">Deg</button>
                <button class="btn scientific">π</button>
                <button class="btn scientific">EE</button>
                <button class="btn scientific">Rand</button>
            </div>

        </div>

        <div class="basic-panel">

            <div class="row">
                <button class="btn scientific">mc</button>
                <button class="btn scientific">m+</button>
                <button class="btn scientific">m-</button>
                <button class="btn scientific">mr</button>
            </div>

            <div class="row">
                <button class="btn function">AC</button>
                <button class="btn function">
                    <i class="fa-solid fa-delete-left"></i>
                </button>
                <button class="btn function">+/-</button>
                <button class="btn operator"><i class="fa-solid fa-divide"></i></button>
            </div>

            <div class="row">
                <button class="btn number">7</button>
                <button class="btn number">8</button>
                <button class="btn number">9</button>
                <button class="btn operator"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="row">
                <button class="btn number">4</button>
                <button class="btn number">5</button>
                <button class="btn number">6</button>
                <button class="btn operator"><i class="fa-solid fa-minus"></i></button>
            </div>

            <div class="row">
                <button class="btn number">1</button>
                <button class="btn number">2</button>
                <button class="btn number">3</button>
                <button class="btn operator"><i class="fa-solid fa-plus"></i></button>
            </div>

            <div class="row">
                <button class="btn operator">%</button>
                <button class="btn number">0</button>
                <button class="btn number">.</button>
                <button class="btn equal"><i class="fa-solid fa-equals"></i></button>
            </div>

        </div>

    </div>

</div>

<script src="../calculator/calculator.js"></script>

</body>
</html>
